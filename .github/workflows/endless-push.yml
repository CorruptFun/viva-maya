name: Game reminders

# ONE CRON, HOURLY. THE SENDER'S CLOCK DECIDES WHAT — IF ANYTHING — GOES OUT.
#
# ⚠️ THIS REPLACED FIVE FIXED-HOUR CRONS THAT COULD NOT KEEP TIME. Until 2026-09-03 each send had
# its own entry and the job worked out which send it was from WHICH cron had fired. GitHub's
# scheduler is best-effort and on this repo it is not remotely close to on time: measured over
# 2026-08-26 → 09-03, the 15:00 UTC entry ran 3.1–3.4 h late, the 19:00 one 2.4–4.9 h, the 00:00
# one 2.4–3.0 h, and the 03:00 one — the ~9pm streak "last call" — 4.7 to 10.9 HOURS late. So the
# last call fired at 1:40–2:00 AM at home, on the NEXT race day, saying "your streak ends at
# midnight, in 22 hours" — and, because migration 0028 had not been applied and the sender was on
# its one-a-day fallback, that one message spent the device's whole day. Every run was green.
#
# The sender now owns the timetable (scripts/send-push.mjs `SLOTS`, on the home clock,
# America/Edmonton): the house gift 08:00–12:00, the quest slate 12:00–16:00, the evening board
# 16:00–19:00 (the season instead on Sunday), the streak last call 20:00–23:30, and nothing in the
# quiet hours. Each hourly run asks the clock which slot it is standing in and skips every device
# that slot has already reached today (`sentInSlot`), so however late or bunched the runs arrive, a
# slot is one notification per device and a run in the quiet hours is a no-op that never touches a
# secret. The volume promise on the opt-in card (src/view/pushoptin.ts VOLUME_RULE = `DAILY_SEND_CAP`)
# is enforced by the per-race-day counter in migration 0028 plus a two-hour minimum gap, on every
# send, whatever the schedule does.
#
# ⚠️ Do not add a second cron with a fixed mode. If you need a new kind of alert, it is a copy
# branch and a slot in the sender, and the hourly run will find it. The minute is deliberately not
# :00 — GitHub's queue is worst at the top of the hour.
on:
  schedule:
    - cron: '37 * * * *' # hourly; the sender picks the slot from the home clock, or does nothing
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which reminder to send (auto = whatever the home clock says is due now)'
        type: choice
        options: [auto, drop, quests, daily, laststand, weekly]
        default: auto
      dry_run:
        description: 'Print what would be sent without sending anything'
        type: boolean
        default: true
      explain:
        description: 'Print WHY each device was or was not sent to (per-device decision lines)'
        type: boolean
        default: false
      force:
        description: 'Send an explicit scope outside its slot (a real send refuses that otherwise)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let a manual test overlap a scheduled run, and never let two hourly runs interleave —
  # the sender's slot latch and budget counter read a row at the top of a run and write it at the
  # end, so serialising here is what makes their answers stable rather than a race. A queued run
  # behind a running one is cancelled by GitHub (one pending per group), which is fine: the hourly
  # runs are identical polls and the next one asks the same question.
  group: endless-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          # Service-role key: bypasses RLS, which is the only way to read push_subscriptions
          # (0011 grants no SELECT to anyone), the events log (0010, same) or a player's own save
          # (0001). A SECRET, never a repo variable — unlike the publishable key, this one must
          # never be readable from the client or the repo UI.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # Passed through env rather than interpolated into the script body. These inputs are typed
          # and come from a collaborator-only trigger, so they are not really attacker-controlled —
          # but `${{ }}` inside `run:` is textual substitution into the shell, and keeping the one
          # habit everywhere is what stops a genuinely untrusted field being pasted in later.
          # On a scheduled run these are empty, so the real send is the default and --dry-run is opt-in.
          DRY_RUN: ${{ inputs.dry_run }}
          EXPLAIN: ${{ inputs.explain }}
          FORCE: ${{ inputs.force }}
          # A scheduled run has no inputs and is always `auto`; a manual run may name a mode.
          SCOPE: ${{ inputs.scope || 'auto' }}
        # A `case` rather than a chain of `[ ] && ARGS=…` tests: a scope that matches nothing must
        # fail the run, because the no-flag default is the WEEKLY season blast — the one wrong answer
        # that reaches every subscriber at once.
        run: |
          case "$SCOPE" in
            auto)      ARGS="--auto" ;;
            drop)      ARGS="--drop" ;;
            quests)    ARGS="--quests" ;;
            daily)     ARGS="--daily" ;;
            laststand) ARGS="--laststand" ;;
            weekly)    ARGS="" ;;
            *) echo "unknown scope: $SCOPE" >&2; exit 1 ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$EXPLAIN" = "true" ]; then ARGS="$ARGS --explain"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/send-push.mjs $ARGS
