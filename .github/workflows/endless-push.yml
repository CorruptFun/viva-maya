name: Endless race reminders

# The race has two clocks, so this workflow has two schedules.
#
# TODAY'S BOARD closes at midnight America/Edmonton (core/endless.ts dayEndsAt — 06:00 UTC on MDT,
# 07:00 UTC on MST). The daily job fires at 01:00 UTC — 6–7 PM on the home crowd's clock, ~5–6 hours
# before the close — while there is still time to take the board. A cron cannot follow DST, so the
# hour is fixed in UTC and the local send time breathes by an hour across the seasons; the message
# computes "in N hours" from the real clock either way.
#
# THE SEASON closes Monday midnight America/Edmonton (core/endless.ts weekEndsAt). Its job fires in
# the same 01:00 UTC slot — which on Monday's UTC calendar is SUNDAY EVENING at home, late enough
# that the totals being reported are close to final.
#
# ⚠️ The UTC day at 01:00 UTC is already TOMORROW on the home clock's calendar: Monday evening in
# Alberta is Tuesday 01:00 UTC. That is why the daily cron runs Tue–Sun (`0,2-6`) and the season owns
# Monday (`1`) — Monday 01:00 UTC IS Sunday evening at home. The two never both fire: a player
# getting two notifications in the same evening is how a subscription gets switched off for good.
#
# GitHub's scheduler is best-effort and can run 10–30 minutes late under load. That is irrelevant
# here: every message says "in N hours", computed at run time from the real clock, so a delayed run
# reports a smaller N rather than saying anything untrue.
on:
  schedule:
    - cron: '0 1 * * 0,2-6' # Tue–Sun 01:00 UTC = Mon–Sat evening at home — today's board
    - cron: '0 1 * * 1'     # Monday 01:00 UTC = Sunday evening at home — the season
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which board to remind about'
        type: choice
        options: [daily, weekly]
        default: daily
      dry_run:
        description: 'Print what would be sent without sending anything'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never let a manual test overlap a scheduled run — two senders would double-notify every player,
  # which is the fastest way to get notifications switched off for good.
  group: endless-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          # Service-role key: bypasses RLS, which is the only way to read push_subscriptions
          # (0011 grants SELECT to nobody). A SECRET, never a repo variable — unlike the
          # publishable key, this one must never be readable from the client or the repo UI.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # Passed through env rather than interpolated into the script body. This particular input is
          # a typed boolean from a collaborator-only trigger, so it is not really attacker-controlled —
          # but `${{ }}` inside `run:` is textual substitution into the shell, and keeping the one
          # habit everywhere is what stops a genuinely untrusted field being pasted in later.
          # On a scheduled run this is empty, so the real send is the default and --dry-run is opt-in.
          DRY_RUN: ${{ inputs.dry_run }}
          # Which board to remind about. A scheduled run has no inputs, so it is decided by WHICH cron
          # fired: the Monday-01:00-UTC entry (Sunday evening at home) is the season, every other
          # evening is that day's board.
          SCOPE: ${{ inputs.scope || (github.event.schedule == '0 1 * * 1' && 'weekly' || 'daily') }}
        run: |
          ARGS=""
          [ "$SCOPE" = "daily" ] && ARGS="--daily"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          node scripts/send-push.mjs $ARGS
