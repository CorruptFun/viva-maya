name: Game reminders

# FIVE SCHEDULES, AT MOST THREE NOTIFICATIONS A DAY.
#
# ⚠️ Read this before adding a sixth entry. The audience is opted in on a card that prints a NUMBER
# (src/view/pushoptin.ts VOLUME_RULE), and that number is `DAILY_SEND_CAP` in scripts/send-push.mjs.
# The promise is kept two ways: every mode has to have something true and specific to say or it stays
# silent, and every send re-checks a per-race-day counter (migration 0028) plus a minimum gap. A new
# cron does not need to respect the cap by hand — the sender refuses past it — but it DOES need
# something worth saying, or it is a slot that spends a player's attention on nothing.
#
# ⚠️ THIS SCHEDULE REPLACED ONE THAT SILENTLY DELIVERED NOTHING. Until 2026-08-26 there were three
# entries and the two weekday sends split the audience by activity: the morning nudge took "was NOT
# here yesterday", the evening one took "was here EXACTLY yesterday". Those look like a partition and
# they leave out the player who is here EVERY day — which was all four subscribers. Every run was
# green and reported `4 opted in · 4 held back · 0 due`. The sender's `dueForMode` carries the full
# account; each run now also prints an away-histogram so the same failure cannot look healthy again.
#
# THE DAY, on the home clock (America/Edmonton; the UTC hours are fixed because cron cannot follow
# DST, so the local times breathe by an hour across the seasons):
#
#   ≈9am   --drop       The HOUSE GIFT by name (src/core/bonusdrop.ts), to anyone not already here
#                       today. An invitation with a whole day behind it — a deadline is the wrong
#                       pressure to put on somebody who is not in the habit yet.
#   ≈1pm   --quests     The only slot that fires for somebody who IS here today: an unfinished quest
#                       slate, counted and never named (src/core/quests.ts).
#   ≈6pm   --daily      Today's board, which closes at midnight. Goes to anyone with real news — a
#                       row on the board, a streak about to break, a wheel within reach, or simply
#                       not here yet today.
#   ≈9pm   --laststand  A live streak that dies at midnight and has not been secured. The narrowest
#                       gate in the sender and the most valuable thing it can say.
#   ≈6pm Sun (weekly)   The season, which closes Monday midnight. The one mode with no activity
#                       filter: a summary silenced for whoever drifted off mid-week is silent for
#                       exactly the people it is for.
#
# ⚠️ THE UTC DAY AT 00:00 AND 03:00 IS ALREADY TOMORROW ON THE HOME CALENDAR: Monday evening in
# Alberta is Tuesday 00:00 UTC. That is why the evening board runs Tue–Sun (`0,2-6`) and the season
# owns Monday (`1`) — Monday 00:00 UTC IS Sunday evening at home. The 15:00 and 19:00 entries need no
# such offset; they are on the same calendar day at home as in UTC. All four weekday slots therefore
# land on the SAME race day key, which is what makes "three a day" mean three per board.
#
# GitHub's scheduler is best-effort and can run 10–30 minutes late under load. That is why
# MIN_GAP_HOURS (2) is looser than the tightest nominal spacing here (3h, evening → last call): a gap
# tuned to the schedule would drop a legitimate send whenever a cron ran late. Every deadline a
# message quotes is computed at run time from the real clock, so a late run reports a smaller number
# rather than saying anything untrue.
on:
  schedule:
    - cron: '0 15 * * *'    # every day 15:00 UTC = ~9am at home — the house gift
    - cron: '0 19 * * *'    # every day 19:00 UTC = ~1pm at home — the quest slate
    - cron: '0 0 * * 0,2-6' # Tue–Sun 00:00 UTC = Mon–Sat evening at home — today's board
    - cron: '0 0 * * 1'     # Monday 00:00 UTC = Sunday evening at home — the season
    - cron: '0 3 * * *'     # every day 03:00 UTC = ~9pm at home — the streak last call
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which reminder to send'
        type: choice
        options: [drop, quests, daily, laststand, weekly]
        default: drop
      dry_run:
        description: 'Print what would be sent without sending anything'
        type: boolean
        default: true
      explain:
        description: 'Print WHY each device was or was not sent to (per-device decision lines)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let a manual test overlap a scheduled run — two senders would double-notify every player,
  # which is the fastest way to get notifications switched off for good. (The sender's own budget
  # counter would catch most of that too, but only after the first one has committed; serialising
  # here is what makes the counter's answer stable rather than a race.)
  group: endless-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          # Service-role key: bypasses RLS, which is the only way to read push_subscriptions
          # (0011 grants no SELECT to anyone), the events log (0010, same) or a player's own save
          # (0001). A SECRET, never a repo variable — unlike the publishable key, this one must
          # never be readable from the client or the repo UI.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # Passed through env rather than interpolated into the script body. These inputs are typed
          # and come from a collaborator-only trigger, so they are not really attacker-controlled —
          # but `${{ }}` inside `run:` is textual substitution into the shell, and keeping the one
          # habit everywhere is what stops a genuinely untrusted field being pasted in later.
          # On a scheduled run these are empty, so the real send is the default and --dry-run is opt-in.
          DRY_RUN: ${{ inputs.dry_run }}
          EXPLAIN: ${{ inputs.explain }}
          # Which reminder to send. A scheduled run has no inputs, so it is decided by WHICH cron
          # fired; the evening board is the fallback because it owns the only multi-day entry.
          # ⚠️ One line on purpose. A folded (`>-`) scalar keeps the newlines of any continuation
          # line indented deeper than its first, so the pretty multi-line version of this expression
          # reaches the expression parser with real newlines inside it — which is a thing to find out
          # from a live cron rather than from a review.
          SCOPE: ${{ inputs.scope || (github.event.schedule == '0 15 * * *' && 'drop') || (github.event.schedule == '0 19 * * *' && 'quests') || (github.event.schedule == '0 3 * * *' && 'laststand') || (github.event.schedule == '0 0 * * 1' && 'weekly') || 'daily' }}
        # A `case` rather than a chain of `[ ] && ARGS=…` tests: with five modes the chain needs an
        # unmatched-scope branch to be meaningful, and a scope that matches nothing silently sending
        # the WEEKLY season blast (the no-flag default) is the one wrong answer that reaches every
        # subscriber at once. An unknown scope fails the run instead.
        run: |
          case "$SCOPE" in
            drop)      ARGS="--drop" ;;
            quests)    ARGS="--quests" ;;
            daily)     ARGS="--daily" ;;
            laststand) ARGS="--laststand" ;;
            weekly)    ARGS="" ;;
            *) echo "unknown scope: $SCOPE" >&2; exit 1 ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$EXPLAIN" = "true" ]; then ARGS="$ARGS --explain"; fi
          node scripts/send-push.mjs $ARGS
